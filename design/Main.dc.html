<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>けしカス PC メイン画面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1E7;font-family:"Nunito","Zen Maru Gothic",sans-serif;color:#2B2A28}
a{color:#3E6FB0}a:hover{color:#2C5590}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F1E7; font-family: 'Nunito', 'Zen Maru Gothic', sans-serif; color: #2B2A28; overflow: hidden">

  <!-- top bar -->
  <header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 24px; border-bottom: 2px solid #E4DCCB; background: #FBF8F1">
    <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="9" width="34" height="22" rx="6" fill="#F29CA3"></rect><rect x="15" y="9" width="22" height="22" rx="0" fill="#3E6FB0"></rect><rect x="31" y="9" width="6" height="22" rx="0" fill="#3E6FB0"></rect><path d="M37 15 v10" stroke="#3E6FB0" stroke-width="0"></path><circle cx="8" cy="35" r="2" fill="#B8B4AC"></circle><circle cx="13" cy="36.5" r="1.3" fill="#B8B4AC"></circle></svg>
      <div style="display: flex; flex-direction: column; line-height: 1">
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: 0.04em">けしカス</span>
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.18em; color: #6B6A66; margin-top: 4px">ERASER CRUMBS</span>
      </div>
    </div>

    <div style="flex-grow: 1; height: 40px; display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 0 16px 0 6px; background: #FFFFFF; border: 1.5px solid #E4DCCB; border-radius: 999px; overflow: hidden">
      <span style="flex-shrink: 0; padding: 5px 12px; border-radius: 999px; background: #2B2A28; color: #F6F1E7; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 13px">カスニュース</span>
      <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; font-size: 15px; white-space: nowrap">なぞの おじいちゃん、「むかしは よかった」と カスを こすりつづける。</span>
    </div>

    <nav style="display: flex; align-items: center; gap: 6px; flex-shrink: 0" aria-label="メニュー">
      <button type="button" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 12px; background: transparent; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 8h6"></path></svg>ずかん</button>
      <button type="button" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 12px; background: transparent; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"></circle><path d="M8.5 14 7 22l5-3 5 3-1.5-8"></path></svg>じっせき</button>
      <button type="button" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 12px; background: transparent; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M21 20H3"></path></svg>とうけい</button>
      <button type="button" aria-label="せってい" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 12px; background: transparent; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
      <button type="button" style="height: 44px; margin-left: 8px; padding: 0 18px; display: flex; align-items: center; gap: 8px; border: 2px solid #2B2A28; border-radius: 12px; background: #FFFFFF; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 14px; cursor: pointer">
        <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><rect x="1" y="2" width="20" height="12" rx="3" fill="#F29CA3" stroke="#2B2A28" stroke-width="1.5"></rect><rect x="9" y="2" width="12" height="12" fill="#3E6FB0" stroke="#2B2A28" stroke-width="1.5"></rect></svg>けしゴムに もどる<span style="padding: 2px 8px; border-radius: 999px; background: #E7B533; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px">+3</span></button>
    </nav>
  </header>

  <div style="flex-grow: 1; display: flex; min-height: 0">

    <!-- left: the crumb -->
    <section style="width: 440px; flex-shrink: 0; box-sizing: border-box; padding: 28px 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; border-right: 2px solid #E4DCCB" aria-label="カス">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 64px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">1.234M</span>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 16px; color: #6B6A66">つぶ</span>
        <span style="margin-top: 6px; padding: 4px 12px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #E4DCCB; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums">+1,284 /s</span>
      </div>

      <div style="position: relative; width: 376px; height: 376px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #E6CDA6 0%, #D9B98C 58%, #C9A676 100%); box-shadow: inset 0 -10px 24px rgba(92,64,30,0.18), 0 10px 0 #E4DCCB">
        <svg width="376" height="376" viewBox="0 0 376 376" style="position: absolute; left: 0; top: 0" aria-hidden="true">
          <path d="M40 140 C120 132 250 150 340 136" stroke="#C69F6C" stroke-width="2" fill="none" opacity="0.5"></path>
          <path d="M28 214 C140 206 240 226 350 210" stroke="#C69F6C" stroke-width="2" fill="none" opacity="0.45"></path>
          <path d="M44 286 C150 280 250 296 330 284" stroke="#C69F6C" stroke-width="2" fill="none" opacity="0.4"></path>
          <ellipse cx="190" cy="262" rx="104" ry="18" fill="#6B4A22" opacity="0.18"></ellipse>
          <path d="M184 92 C238 84 284 118 286 172 C288 224 250 262 190 264 C126 266 88 232 90 180 C92 128 128 98 184 92 Z" fill="#A9A49B"></path>
          <path d="M184 92 C238 84 284 118 286 172 C288 224 250 262 190 264 C126 266 88 232 90 180 C92 128 128 98 184 92 Z" fill="none" stroke="#2B2A28" stroke-width="3" stroke-linejoin="round"></path>
          <path d="M122 132 C140 110 172 102 200 104" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55"></path>
          <ellipse cx="228" cy="124" rx="10" ry="6" fill="#FFFFFF" opacity="0.6"></ellipse>
          <path d="M262 210 C272 232 268 250 256 256" stroke="#8E897F" stroke-width="3" fill="none" stroke-linecap="round"></path>
          <circle cx="166" cy="176" r="5" fill="#2B2A28"></circle>
          <circle cx="216" cy="176" r="5" fill="#2B2A28"></circle>
          <circle cx="68" cy="246" r="6" fill="#A9A49B" stroke="#2B2A28" stroke-width="2"></circle>
          <circle cx="306" cy="252" r="4" fill="#A9A49B" stroke="#2B2A28" stroke-width="2"></circle>
          <circle cx="300" cy="104" r="3.5" fill="#A9A49B" stroke="#2B2A28" stroke-width="1.5"></circle>
          <circle cx="84" cy="96" r="3" fill="#A9A49B" stroke="#2B2A28" stroke-width="1.5"></circle>
        </svg>
        <span style="position: absolute; left: 262px; top: 64px; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px; color: #2B2A28; opacity: 0.9">+42</span>
        <span style="position: absolute; left: 70px; top: 116px; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; color: #2B2A28; opacity: 0.5">+42</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="padding: 3px 10px; border-radius: 999px; background: #3E6FB0; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px; letter-spacing: 0.06em">STAGE 4</span>
          <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 20px">りっぱな ねばねばカス</span>
        </div>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; font-size: 13px; color: #6B6A66">なまえ: ポチ ・ つぎの しんかまで 99.8%</span>
        <div style="width: 300px; height: 8px; border-radius: 999px; background: #E4DCCB; overflow: hidden"><div style="width: 99.8%; height: 100%; border-radius: 999px; background: #F29CA3"></div></div>
      </div>

      <div style="position: relative; align-self: stretch; box-sizing: border-box; padding: 14px 18px; border-radius: 18px; background: #FFFFFF; border: 2px solid #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.6; text-align: center">「つくえの はしっこが せかいの はしだと おもってた」</div>

      <div style="display: flex; gap: 12px; align-self: stretch; margin-top: auto">
        <button type="button" style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid #2B2A28; border-radius: 14px; background: #F29CA3; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 #2B2A28; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>ほめる</button>
        <button type="button" style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid #2B2A28; border-radius: 14px; background: #FFFFFF; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 #2B2A28; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"></path><path d="M3 12h16a3 3 0 1 1-3 3"></path><path d="M3 16h7"></path></svg>ふーっと ふく</button>
      </div>
    </section>

    <!-- center: the desk -->
    <section style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px; position: relative" aria-label="つくえ">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 20px">つくえ</h2>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; font-size: 13px; color: #6B6A66">なかまが カスを あつめています</span>
      </div>

      <sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
        <div style="height: 104px; flex-shrink: 0; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 18px; border-radius: 18px; background: linear-gradient(180deg, #E3C79D 0%, #D9B98C 100%); box-shadow: inset 0 -4px 0 rgba(92,64,30,0.14)">
          <div style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 15px">{{row.name}}</span>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: #4A3A22; font-variant-numeric: tabular-nums">{{row.rate}}</span>
          </div>
          <div style="flex-grow: 1; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; overflow: hidden; max-height: 76px">
            <sc-for list="{{row.units}}" as="u" hint-placeholder-count="8">
              <sc-if value="{{row.isFinger}}" hint-placeholder-val="{{true}}">
                <svg width="26" height="34" viewBox="0 0 26 34" aria-hidden="true"><rect x="7" y="2" width="12" height="28" rx="6" fill="#F4D7BE" stroke="#2B2A28" stroke-width="1.8"></rect><rect x="9.5" y="4.5" width="7" height="7" rx="3" fill="#FFFFFF" stroke="#2B2A28" stroke-width="1.2"></rect><path d="M9 22h8" stroke="#2B2A28" stroke-width="1.2"></path></svg>
              </sc-if>
              <sc-if value="{{row.isAnt}}" hint-placeholder-val="{{false}}">
                <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M8 14 3 20M12 14l-2 7M18 14l2 7M22 14l6 6M10 8 6 3M24 8l4-5" stroke="#2B2A28" stroke-width="1.5" stroke-linecap="round"></path><ellipse cx="7" cy="11" rx="5" ry="4.5" fill="#2B2A28"></ellipse><ellipse cx="15" cy="12" rx="4" ry="3.5" fill="#2B2A28"></ellipse><ellipse cx="25" cy="11" rx="7" ry="5.5" fill="#2B2A28"></ellipse><circle cx="30" cy="5" r="2.5" fill="#A9A49B" stroke="#2B2A28" stroke-width="1"></circle></svg>
              </sc-if>
              <sc-if value="{{row.isGrandpa}}" hint-placeholder-val="{{false}}">
                <svg width="36" height="44" viewBox="0 0 36 44" aria-hidden="true"><path d="M6 44c0-10 5-16 12-16s12 6 12 16" fill="#8FA7C8" stroke="#2B2A28" stroke-width="1.8"></path><circle cx="18" cy="17" r="11" fill="#F4D7BE" stroke="#2B2A28" stroke-width="1.8"></circle><path d="M8 13c2-6 6-7 10-7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path><circle cx="13.5" cy="17" r="3.2" fill="none" stroke="#2B2A28" stroke-width="1.4"></circle><circle cx="22.5" cy="17" r="3.2" fill="none" stroke="#2B2A28" stroke-width="1.4"></circle><path d="M16.7 17h2.6" stroke="#2B2A28" stroke-width="1.4"></path><path d="M14 23.5c2 1.3 6 1.3 8 0" stroke="#2B2A28" stroke-width="1.4" stroke-linecap="round" fill="none"></path></svg>
              </sc-if>
              <sc-if value="{{row.isClass}}" hint-placeholder-val="{{false}}">
                <svg width="52" height="44" viewBox="0 0 52 44" aria-hidden="true"><path d="M4 16 26 4l22 12" fill="none" stroke="#2B2A28" stroke-width="1.8" stroke-linejoin="round"></path><rect x="7" y="16" width="38" height="26" rx="2" fill="#FBF8F1" stroke="#2B2A28" stroke-width="1.8"></rect><rect x="12" y="20" width="28" height="11" rx="1.5" fill="#3C5A48" stroke="#2B2A28" stroke-width="1.4"></rect><path d="M16 25h8M16 28h13" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"></path><rect x="22" y="33" width="8" height="9" fill="#F29CA3" stroke="#2B2A28" stroke-width="1.4"></rect></svg>
              </sc-if>
            </sc-for>
          </div>
          <span style="flex-shrink: 0; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px; color: #4A3A22; font-variant-numeric: tabular-nums">x{{row.count}}</span>
        </div>
      </sc-for>

      <div style="height: 104px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 18px; border: 2px dashed #CDBFA5; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 15px; color: #6B6A66">つぎの なかまを まっています</div>

      <button type="button" aria-label="ゴールデンカス" style="position: absolute; right: 84px; top: 330px; width: 76px; height: 76px; padding: 0; border: none; background: transparent; cursor: pointer">
        <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
          <circle cx="38" cy="38" r="36" fill="#E7B533" opacity="0.22"></circle>
          <path d="M38 4v10M38 62v10M4 38h10M62 38h10M14 14l7 7M55 55l7 7M62 14l-7 7M21 55l-7 7" stroke="#E7B533" stroke-width="3" stroke-linecap="round"></path>
          <path d="M37 21c10-1 18 6 18 16s-7 17-17 17-17-6-17-16 6-16 16-17z" fill="#E7B533" stroke="#2B2A28" stroke-width="2.4"></path>
          <path d="M28 30c3-4 7-5 11-5" stroke="#FFF6D6" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
          <circle cx="33" cy="38" r="2" fill="#2B2A28"></circle><circle cx="43" cy="38" r="2" fill="#2B2A28"></circle>
        </svg>
      </button>
    </section>

    <!-- right: shop -->
    <aside style="width: 400px; flex-shrink: 0; box-sizing: border-box; padding: 24px 24px 20px; display: flex; flex-direction: column; gap: 16px; background: #FBF8F1; border-left: 2px solid #E4DCCB" aria-label="みせ">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 20px">みせ</h2>
        <div style="display: flex; padding: 3px; gap: 2px; border-radius: 12px; background: #EFE7D6" role="group" aria-label="まとめがい">
          <button type="button" style="min-width: 44px; height: 32px; border: none; border-radius: 9px; background: #2B2A28; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px">x1</button>
          <button type="button" style="min-width: 44px; height: 32px; border: none; border-radius: 9px; background: transparent; color: #2B2A28; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px">x10</button>
          <button type="button" style="min-width: 44px; height: 32px; border: none; border-radius: 9px; background: transparent; color: #2B2A28; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 13px">x100</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 13px; color: #6B6A66">アップグレード</span>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-label="えんぴつの おしりを みがく" style="height: 52px; display: flex; align-items: center; justify-content: center; border: 2px solid #2B2A28; border-radius: 12px; background: #FFFFFF; cursor: pointer">
            <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 22 20 8l3 3L9 25H6z" fill="#E7B533" stroke="#2B2A28" stroke-width="1.8" stroke-linejoin="round"></path><path d="M20 8l2-2a2 2 0 0 1 3 3l-2 2" fill="#F29CA3" stroke="#2B2A28" stroke-width="1.8"></path></svg></button>
          <button type="button" aria-label="アリさんの ながぐつ" style="height: 52px; display: flex; align-items: center; justify-content: center; border: 2px solid #2B2A28; border-radius: 12px; background: #FFFFFF; cursor: pointer">
            <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 4h8v12l6 3v5H6V4z" fill="#3E6FB0" stroke="#2B2A28" stroke-width="1.8" stroke-linejoin="round"></path></svg></button>
          <button type="button" aria-label="のり" style="height: 52px; display: flex; align-items: center; justify-content: center; border: 2px solid #2B2A28; border-radius: 12px; background: #FFFFFF; cursor: pointer">

}
