  <div style="display: flex; gap: 10px; margin: 14px 16px 0">
    <button type="button" style="flex-grow: 1; height: 48px; border: 2px solid #2B2A28; border-radius: 14px; background: #F29CA3; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 #2B2A28">ほめる</button>
    <button type="button" style="flex-grow: 1; height: 48px; border: 2px solid #2B2A28; border-radius: 14px; background: #FFFFFF; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 #2B2A28">ふーっと ふく</button>

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; border-radius: 12px; background: #2B2A28; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px">

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; border-radius: 12px; background: transparent; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px">
