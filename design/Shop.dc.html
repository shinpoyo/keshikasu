</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #F6F1E7; font-family: 'Nunito', 'Zen Maru Gothic', sans-serif; color: #2B2A28; overflow: hidden">

  <header style="flex-shrink: 0; box-sizing: border-box; padding: 14px 16px 12px; display: flex; align-items: center; gap: 12px; background: #FBF8F1; border-bottom: 2px solid #E4DCCB">
    <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: #FAF8F3; border: 1.5px solid #E4DCCB"><img src="/_blob/d0bbb2a0c5793b3a19780974d72add99" alt="" style="width: 48px; height: 48px"></span>
    <div style="display: flex; flex-direction: column; line-height: 1.1">
      <span style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 28px; font-variant-numeric: tabular-nums">23,456</span>

      <div style="display: flex; padding: 3px; gap: 2px; border-radius: 12px; background: #EFE7D6" role="group" aria-label="まとめがい">

    <div style="display: flex; flex-direction: column; gap: 8px">

      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1 1 0; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid #2B2A28; border-radius: 12px; background: #FFFFFF; box-shadow: 0 3px 0 #2B2A28">
          <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><path d="M6 22 20 8l3 3L9 25H6z" fill="#E7B533" stroke="#2B2A28" stroke-width="1.8" stroke-linejoin="round"></path><path d="M20 8l2-2a2 2 0 0 1 3 3l-2 2" fill="#F29CA3" stroke="#2B2A28" stroke-width="1.8"></path></svg>

        <button type="button" style="flex: 1 1 0; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid #2B2A28; border-radius: 12px; background: #FFFFFF; box-shadow: 0 3px 0 #2B2A28">

          <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px">8,000</span></button>
        <button type="button" style="flex: 1 1 0; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 2px solid #E4DCCB; border-radius: 12px; background: #F3EDE1; opacity: 0.8">
          <svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="8" fill="#E9E4DA" stroke="#2B2A28" stroke-width="1.6" stroke-dasharray="2 2"></circle></svg>
          <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; color: #B0413E">40,000</span></button>
        <button type="button" aria-label="まだ ひみつ" style="flex: 1 1 0; height: 64px; border: 2px dashed #CDBFA5; border-radius: 12px; background: transparent; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; color: #A59A86">?</button>

      <div style="box-sizing: border-box; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #E4DCCB; font-family: 'Zen Maru Gothic', sans-serif; font-size: 13px; line-height: 1.5">

    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 13px; color: #6B6A66">なかま</span>
      <sc-for list="{{shop}}" as="s" hint-placeholder-count="6">

            <sc-if value="{{s.isFinger}}" hint-placeholder-val="{{false}}"><svg width="20" height="28" viewBox="0 0 26 34" aria-hidden="true"><rect x="7" y="2" width="12" height="28" rx="6" fill="#F4D7BE" stroke="#2B2A28" stroke-width="2"></rect><rect x="9.5" y="4.5" width="7" height="7" rx="3" fill="#FFFFFF" stroke="#2B2A28" stroke-width="1.4"></rect></svg></sc-if>

            <sc-if value="{{s.isGrandpa}}" hint-placeholder-val="{{false}}"><svg width="28" height="34" viewBox="8 7 56 68.4" aria-hidden="true"><path d="M8 88c0-16 9-26 28-26s28 10 28 26z" fill="#A9BF95" stroke="#2B2A28" stroke-width="3.6" stroke-linejoin="round"/><path d="M28 63.5 36 76l8-12.5c-2.4-.9-5-1.3-8-1.3s-5.6.4-8 1.3z" fill="#FFFFFF" stroke="#2B2A28" stroke-width="2.52" stroke-linejoin="round"/><path d="M30.5 56v6.5c3.5 2 7.5 2 11 0V56" fill="#F2D2B6" stroke="#2B2A28" stroke-width="2.52"/><path d="M54.5 42c3 -1 5.5 -4 4.5 -8c2.5 -2 2 -6.5 -0.5 -8c1 -3 -1 -6 -4 -6c-0.5 3 -1 8 -0.5 13c0 3 0 6 0.5 9z" fill="#FFFFFF" stroke="#8C8A84" stroke-width="2.52" stroke-linejoin="round"/><path d="M17.5 42c-3 -1 -5.5 -4 -4.5 -8c-2.5 -2 -2 -6.5 0.5 -8c-1 -3 1 -6 4 -6c0.5 3 1 8 0.5 13c0 3 0 6 -0.5 9z" fill="#FFFFFF" stroke="#8C8A84" stroke-width="2.52" stroke-linejoin="round"/><ellipse cx="15.5" cy="37" rx="4.2" ry="5.6" fill="#F2CFB2" stroke="#2B2A28" stroke-width="2.8800000000000003"/><ellipse cx="56.5" cy="37" rx="4.2" ry="5.6" fill="#F2CFB2" stroke="#2B2A28" stroke-width="2.8800000000000003"/><path d="M36 13c11.5 0 20 8.5 20 21 0 14-8.6 24-20 24S16 48 16 34c0-12.5 8.5-21 20-21z" fill="#F7DDC6" stroke="#2B2A28" stroke-width="3.6"/><path d="M22.5 29.5c2.5-3.2 7-3.8 10-1.4-2.2 .9-5.8 1-10 1.4z" fill="#FFFFFF" stroke="#8C8A84" stroke-width="2.16" stroke-linejoin="round"/><path d="M49.5 29.5c-2.5-3.2-7-3.8-10-1.4 2.2 .9 5.8 1 10 1.4z" fill="#FFFFFF" stroke="#8C8A84" stroke-width="2.16" stroke-linejoin="round"/><path d="M24.8 36.3c1.6-2 4.4-2 6 0M41.2 36.3c1.6-2 4.4-2 6 0" stroke="#2B2A28" stroke-width="3.42" stroke-linecap="round" fill="none"/><circle cx="27.8" cy="36.4" r="5.6" fill="#FFFFFF" fill-opacity="0.18" stroke="#8A6A3E" stroke-width="2.16"/><circle cx="44.2" cy="36.4" r="5.6" fill="#FFFFFF" fill-opacity="0.18" stroke="#8A6A3E" stroke-width="2.16"/><path d="M33.4 36c1.6-1.2 3.6-1.2 5.2 0M22.2 35.4 17 34.4M49.8 35.4l5.2-1" stroke="#8A6A3E" stroke-width="1.9800000000000002" fill="none" stroke-linecap="round"/><ellipse cx="23.5" cy="44.5" rx="4" ry="2.6" fill="#F29CA3" opacity="0.55"/><ellipse cx="48.5" cy="44.5" rx="4" ry="2.6" fill="#F29CA3" opacity="0.55"/><path d="M36 38.5c3.2 0 4.6 2.6 4.3 4.6-.3 2-2.3 2.8-4.3 2.8s-4-.8-4.3-2.8c-.3-2 1.1-4.6 4.3-4.6z" fill="#EFBFA0" stroke="#2B2A28" stroke-width="2.16"/><path d="M36 45.8c-2.5-1.6-6.5-1.8-9 .4-1.4 1.3-1 3.3.8 3.6 3 .5 6-.4 8.2-2.2 2.2 1.8 5.2 2.7 8.2 2.2 1.8-.3 2.2-2.3.8-3.6-2.5-2.2-6.5-2-9-.4z" fill="#FFFFFF" stroke="#8C8A84" stroke-width="2.16" stroke-linejoin="round"/><path d="M32.2 51.2c2.4 1.8 5.2 1.8 7.6 0" stroke="#2B2A28" stroke-width="2.7" stroke-linecap="round" fill="none"/></svg></sc-if>
            <sc-if value="{{s.isClass}}" hint-placeholder-val="{{false}}"><svg width="32" height="28" viewBox="0 0 52 44" aria-hidden="true"><path d="M4 16 26 4l22 12" fill="none" stroke="#2B2A28" stroke-width="2.4" stroke-linejoin="round"></path><rect x="7" y="16" width="38" height="26" rx="2" fill="#FBF8F1" stroke="#2B2A28" stroke-width="2.4"></rect><rect x="12" y="20" width="28" height="11" rx="1.5" fill="#3C5A48"></rect></svg></sc-if>
            <sc-if value="{{s.isClub}}" hint-placeholder-val="{{false}}"><svg width="30" height="22" viewBox="0 0 22 16" aria-hidden="true"><rect x="1" y="2" width="20" height="12" rx="3" fill="#F29CA3" stroke="#2B2A28" stroke-width="1.5"></rect><rect x="9" y="2" width="12" height="12" fill="#3E6FB0" stroke="#2B2A28" stroke-width="1.5"></rect></svg></sc-if>
            <sc-if value="{{s.isLocked}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A59A86" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></sc-if>
          </span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 15px; color: #2B2A28">{{s.name}}</span>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; color: {{s.priceColor}}; font-variant-numeric: tabular-nums">{{s.price}} ・ {{s.rate}}</span>
          </span>
          <span style="font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px; color: #CDBFA5; font-variant-numeric: tabular-nums">{{s.owned}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #FBF8F1; border-top: 2px solid #E4DCCB" aria-label="タブ">
    <a href="Mobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; color: #2B2A28; text-decoration: none; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 3.5c5-.5 9 3 9 8.3s-3.7 8.7-8.6 8.7-9-3.2-9-8.2 3.6-8.3 8.6-8.8z" fill="none" stroke="#2B2A28" stroke-width="2"></path></svg>カス</a>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; border-radius: 12px; background: transparent; color: #2B2A28; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9h18"></path><path d="M5 9v11M19 9v11"></path><path d="M3 5h18v4H3z"></path></svg>つくえ</button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; border-radius: 12px; background: #2B2A28; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.5 11h-13z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg>みせ</button>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; color: #2B2A28; text-decoration: none; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>メニュー</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const can = { bg: '#FFFFFF', border: '2px solid #2B2A28', opacity: 1, priceColor: '#2B2A28' };
    const cant = { bg: '#F6F1E7', border: '2px solid #E4DCCB', opacity: 0.75, priceColor: '#B0413E' };
    const kind = (k) => ({ isFinger: k === 'finger', isAnt: k === 'ant', isGrandpa: k === 'grandpa', isClass: k === 'class', isClub: k === 'club', isLocked: k === 'locked' });
    const shop = [
      Object.assign({ name: 'ゆび', price: '2,470', rate: '+0.1 /s', owned: '35' }, can, kind('finger')),
      Object.assign({ name: 'アリさん', price: '3,670', rate: '+1 /s', owned: '26' }, can, kind('ant')),
      Object.assign({ name: 'しらない おじいちゃん', price: '5,130', rate: '+8 /s', owned: '12' }, can, kind('grandpa')),
      Object.assign({ name: 'きょうしつ', price: '18,250', rate: '+47 /s', owned: '3' }, can, kind('class')),
      Object.assign({ name: 'けしゴムぶ', price: '130,000', rate: '+260 /s', owned: '0' }, cant, kind('club')),
      Object.assign({ name: '？？？', price: '1.400M', rate: '???', owned: '' }, cant, kind('locked'))
    ];
    return { shop };
  }
}
</script>
