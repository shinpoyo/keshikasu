<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>けしカス しんかの だんかい</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1E7;font-family:"Nunito","Zen Maru Gothic",sans-serif;color:#2B2A28}
a{color:#3E6FB0}a:hover{color:#2C5590}
</style>
</helmet>
<div style="width: 1440px; height: 600px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 32px; background: #F6F1E7; font-family: 'Nunito', 'Zen Maru Gothic', sans-serif; color: #2B2A28">
  <div style="display: flex; align-items: baseline; gap: 20px">
    <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 32px">カスの しんか</h1>
    <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; font-size: 15px; color: #6B6A66">はじめは ただの にょろにょろ。あつめるほど まとまって、いつか なにかが うかぶ。</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="position: relative; height: 240px; border-radius: 18px; overflow: hidden; background: repeating-linear-gradient(176deg, #D2B287 0px, #D8BA90 7px, #CFAE82 13px, #D6B78C 22px); box-shadow: inset 0 0 0 1px rgba(92,64,30,0.12)">
          <div style="position: absolute; left: 22px; top: 18px; right: 22px; bottom: 18px; border-radius: 3px; background: #FAF8F3; box-shadow: 0 8px 18px rgba(60,40,15,0.25), 0 1px 2px rgba(0,0,0,0.16)"></div>
          <img src="{{s.img}}" alt="{{s.name}}" style="position: absolute; left: 50%; top: 50%; width: 230px; height: 230px; margin-left: -115px; margin-top: -115px">
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="padding: 3px 10px; border-radius: 999px; background: {{s.badge}}; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 12px; letter-spacing: 0.06em">STAGE {{s.n}}</span>
          <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: #6B6A66; font-variant-numeric: tabular-nums">{{s.need}}</span>
        </div>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 19px">{{s.name}}</span>
        <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.6; color: #4A4946">{{s.line}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const blue = '#3E6FB0';
    return {
      stages: [
        { n: 1, need: '0 つぶ', name: 'にょろにょろの カス', line: 'ふつうの けしカス。まだ なにも おもっていない。', img: '/_blob/ff300876a7820703adeac29b272f1480', badge: blue },
        { n: 2, need: '100 つぶ', name: 'ちらばった カス', line: 'なかまが ふえた。みんな すこし はなれている。', img: '/_blob/54eb8f6f4a00503d427f3a7c53900987', badge: blue },
        { n: 3, need: '10K つぶ', name: 'こんもりの カス', line: 'よりあつまって やまに なった。どりょくの あかし。', img: '/_blob/d0bbb2a0c5793b3a19780974d72add99', badge: blue },
        { n: 4, need: '1M つぶ', name: 'まるまった カス', line: 'ころころ した。ねりけしでは ない。', img: '/_blob/ddc0460e1f7a54972a69f53735477b5e', badge: blue },
        { n: 5, need: '1B つぶ', name: 'かおが うかんだ カス', line: 'かおが うかんだ。きのせいかも しれない。', img: '/_blob/c4c8c004f7d5df72c74959e82b80b71a', badge: '#B07A10' }
      ]
    };
  }
}
</script>
</body>
</html>
